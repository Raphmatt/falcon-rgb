# Builds the browser version (WebAssembly + WebHID) and publishes it on GitHub Pages.
# Enable it once under Settings → Pages → Source: GitHub Actions.
name: Web app

on:
  push:
    branches: [main]
    # Only what ends up in the web app (falcon-cli and docs are not part of it). For anything
    # else, start the workflow by hand (Actions → Web app → Run workflow).
    paths:
      - "crates/falcon-core/**"
      - "crates/falcon-gui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - name: Build
        run: trunk build --release --config crates/falcon-gui/Trunk.toml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
