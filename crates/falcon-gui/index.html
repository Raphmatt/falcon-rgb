<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Falcon RGB</title>
  <meta name="description" content="Configure the Falcon-20 RGB macro keypad in the browser (WebHID).">
  <!-- Built by trunk: compiles this crate to WebAssembly and wires up the JS glue. -->
  <!-- wasm-opt must accept the features rustc enables by default for wasm32. -->
  <link data-trunk rel="rust" data-bin="falcon-gui"
        data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-multivalue --enable-reference-types" />
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f2; }
    @media (prefers-color-scheme: dark) { html, body { background: #1b1b1b; } }
    canvas#falcon { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center;
               font: 15px system-ui, sans-serif; color: #888; }
  </style>
</head>
<body>
  <canvas id="falcon"></canvas>
  <div id="loading">Loading Falcon RGB…</div>
  <script>
    // eframe clears the canvas once it runs; drop the hint then.
    new MutationObserver((_, o) => { const c = document.getElementById("falcon");
      if (c.width > 0) { document.getElementById("loading")?.remove(); o.disconnect(); } })
      .observe(document.getElementById("falcon"), { attributes: true });
  </script>
</body>
</html>
