# Browser build of the desktop app: `just web` (dev server) / `just web-build` (→ dist/web).
[build]
target = "index.html"
dist = "../../dist/web"
# Relative asset URLs, so the build works from any path (e.g. GitHub Pages project sites).
public_url = "./"

[serve]
addresses = ["127.0.0.1"]
port = 8080
