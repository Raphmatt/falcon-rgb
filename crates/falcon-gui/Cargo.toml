[package]
name = "falcon-gui"
description = "Desktop app for the MAX Falcon-20 RGB keypad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "falcon-gui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
eframe = { workspace = true }
rfd = { workspace = true }
serde_json = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
falcon-core = { workspace = true, features = ["hid"] }

# Browser build (trunk): WebHID instead of hidapi, localStorage instead of the config dir.
[target.'cfg(target_arch = "wasm32")'.dependencies]
falcon-core = { workspace = true }
futures-channel = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
